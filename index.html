<head>

    <style>
        /* ==================== 基础重置与公共样式 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", Arial, sans-serif; }
        body { background-color: #f5f6f8; color: #333; font-size: 14px; }
        a { text-decoration: none; color: inherit; cursor: pointer; }
        ul { list-style: none; }

        /* 顶部 Header */
        .header-top { background-color: #fff; display: flex; align-items: center; padding: 20px 40px; border-bottom: 2px solid #d31111; }
        .logo-text { font-size: 24px; font-weight: bold; color: #d31111; letter-spacing: 1px; }

        /* 面包屑 */
        .breadcrumb { padding: 15px 40px; font-size: 13px; color: #666; }

        .breadcrumb a:hover { color: #f26e21; text-decoration: underline; }
        .breadcrumb span { color: #d31111; margin: 0 5px; }

        /* ==================== 页面 1：列表页专属样式 ==================== */
        .list-container { width: 1200px; margin: 0 auto 40px; background: #fff; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .search-area { display: flex; justify-content: center; align-items: center; margin: 20px 0 30px; gap: 10px; }
        .search-box { display: flex; border: 1px solid #ddd; width: 500px; height: 40px; }
        .search-box input { flex: 1; border: none; padding: 0 15px; outline: none; }
        .search-box select { border: none; border-left: 1px solid #ddd; padding: 0 10px; background: #f9f9f9; outline: none; color: #666; }
        .btn-search { background-color: #f26e21; color: #fff; border: none; padding: 0 30px; height: 40px; cursor: pointer; border-radius: 2px; font-size: 14px; }
        .btn-reset { background-color: #fff; color: #f26e21; border: 1px solid #f26e21; padding: 0 30px; height: 40px; cursor: pointer; border-radius: 2px; font-size: 14px; }

        .stats-bar { display: flex; justify-content: space-between; background-color: #fffaf5; border: 1px solid #ffe4cc; padding: 15px 40px; margin-bottom: 20px; border-radius: 4px; }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 20px; color: #f26e21; font-weight: bold; margin-bottom: 5px; }
        .stat-item .label { font-size: 12px; color: #666; }
        .stat-item.clickable { cursor: pointer; }
        .stat-item.clickable:hover .num { color: #d35400; }

        .main-layout { display: flex; gap: 20px; }
        .sidebar-filter { width: 220px; border: 1px solid #eee; background: #fff; }
        .filter-section { border-bottom: 1px solid #eee; padding: 15px; }
        .filter-title { font-weight: bold; color: #f26e21; margin-bottom: 15px; font-size: 14px; border-left: 3px solid #f26e21; padding-left: 8px; }
        .filter-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; color: #555; }
        .filter-item input[type="checkbox"] { margin-right: 8px; }
        .filter-item .count { color: #999; margin-left: 5px; }

        .content-area { flex: 1; }
        .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        .tabs div { padding: 12px 24px; cursor: pointer; font-size: 16px; color: #666; }
        .tabs div.active { color: #f26e21; border-bottom: 2px solid #f26e21; font-weight: bold; }
        .list-info { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #666; margin-bottom: 15px; }
        .sort-options span { margin-left: 15px; cursor: pointer; }
        .sort-options span.active { color: #f26e21; }

        /* 公共表格样式 */
        .result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .result-table th, .result-table td { border: 1px solid #eee; padding: 12px 15px; text-align: left; }
        .result-table th { background-color: #f9f9f9; color: #666; font-weight: normal; }
        .result-table tr:hover { background-color: #fdf5f0; }
        .result-table td a { color: #333; text-decoration: underline; }
        .result-table td a:hover { color: #f26e21; text-decoration: underline; }
        .action-link { color: #f26e21 !important; cursor: pointer; }

        /* 公共分页样式 */
        .pagination { display: flex; justify-content: flex-end; align-items: center; margin-top: 20px; font-size: 13px; gap: 5px; }
        .pagination span, .pagination a { padding: 5px 10px; border: 1px solid #ddd; border-radius: 2px; color: #666; }
        .pagination a.active { background-color: #f26e21; color: #fff; border-color: #f26e21; }
        .pagination select { padding: 5px; border: 1px solid #ddd; outline: none; margin: 0 10px; }

        /* ==================== 页面 2：详情页专属样式 ==================== */
        .detail-container { width: 1200px; margin: 0 auto 40px; display: flex; gap: 20px; }
        .detail-main { flex: 1; background: #fff; padding: 30px; border: 1px solid #eee; min-height: 800px; }
        .btn-back { display: inline-block; margin-bottom: 20px; padding: 8px 20px; background: #f26e21; color: #fff; border: none; border-radius: 3px; font-size: 14px; cursor: pointer; }
        .btn-back:hover { background: #d35400; }
        .article-title { text-align: center; font-size: 22px; font-weight: bold; color: #333; margin-bottom: 40px; letter-spacing: 1px; }

        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; font-size: 14px; }
        .meta-item { display: flex; }
        .meta-label { color: #333; font-weight: bold; width: 80px; flex-shrink: 0; }
        .meta-value { color: #555; flex: 1; }
        .meta-actions { display: flex; gap: 10px; }
        .btn-orange { border: 1px solid #f26e21; color: #f26e21; background: #fff; padding: 4px 15px; border-radius: 2px; font-size: 12px; cursor: pointer; }
        .btn-orange:hover { background: #f26e21; color: #fff; }

        .article-content { border-top: 1px solid #eee; padding-top: 20px; line-height: 2; color: #444; font-size: 14px; }

        .article-content .indent-2 { padding-left: 4em; }

        .bottom-section { margin-top: 40px; }

        .detail-tabs { display: flex; border-bottom: 1px solid #eee; margin-bottom: 20px; }
        .detail-tabs .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; color: #333; transition: all 0.2s; }
        .detail-tabs .tab:hover { color: #f26e21; }
        .detail-tabs .tab.active { color: #f26e21; font-weight: bold; border-bottom: 2px solid #f26e21; }

        /* 右侧边栏 */
        .sidebar-widgets { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .widget { background: #fff; border: 1px solid #eee; padding: 15px; }
        .widget-title { font-size: 14px; font-weight: bold; color: #f26e21; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .widget-title::before { content: ''; display: inline-block; width: 3px; height: 14px; background: #f26e21; margin-right: 8px; }
        .widget-title .more { font-size: 12px; color: #999; font-weight: normal; cursor: pointer; }
        .rec-list li { font-size: 13px; color: #666; margin-bottom: 12px; list-style-type: disc; margin-left: 15px; cursor: pointer; }
        .rec-list li:hover { color: #f26e21; }

        .word-cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 20px 10px; }
        .word-cloud span { cursor: pointer; transition: transform 0.2s; }
        .word-cloud span:hover { transform: scale(1.1); }
        .wc-large { font-size: 22px; font-weight: bold; color: #f26e21; }
        .wc-medium { font-size: 16px; font-weight: bold; color: #d35400; }
        .wc-small { font-size: 14px; color: #888; }
        .wc-tiny { font-size: 12px; color: #aaa; }

        .graph-circle { width: 100px; height: 100px; background: #f26e21; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 12px; font-weight: bold; text-align: center; }
    </style>

        }

        // 内容提要按层级缩进渲染（去掉行尾页码数字）
        function renderAbstract(text) {
            const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
            let html = '<p style="font-weight: bold;">内容提要</p>';
            for (let line of lines) {
                let cls = '';
                if (/^[一二三四五六七八九十]+、/.test(line)) cls = '';
                else if (/^[（(][一二三四五六七八九十]+[）)]/.test(line)) cls = 'indent-1';
                else if (/^[0-9]+[.．、]/.test(line) || /^[（(][0-9]+[）)]/.test(line)) cls = 'indent-2';

                // 去掉行尾页码数字
                line = line.replace(/[\s　]*[0-9]{1,4}\s*$/, '').trim();

                html += '<p class="' + cls + '">' + esc(line) + '</p>';
            }
            return html;
        }

        // 搜索字段：名称、立项单位、承担单位、主要研究人员、完成单位
        function searchFields(r) {
            const vals = [];
            vals.push(r['名称'], r['立项单位'], r['承担单位'], r['主要研究人员'], r['完成单位']);
            splitUnits(r['立项单位']).forEach(x => vals.push(x));
            splitUnits(r['承担单位']).forEach(x => vals.push(x));
            splitUnits(r['完成单位']).forEach(x => vals.push(x));
            splitResearchers(r['主要研究人员']).forEach(x => vals.push(x));
            return vals.map(v => String(v || '').trim().toLowerCase()).filter(Boolean);
        }

        function filteredData() {
            const kw = searchKeyword.trim().toLowerCase();
            return DATA.filter(r => {
                if (filterYear && r['年度'] !== filterYear) return false;
                if (filterCategory && r['分类'] !== filterCategory) return false;
                if (kw) {
                    const vals = searchFields(r);
                    if (searchMode === '精确匹配') {
                        if (!vals.some(v => v === kw)) return false;
                    } else if (!vals.some(v => v.indexOf(kw) >= 0)) {
                        return false;
                    }
                }
                return true;
            });
        }

        // ---------- 列表页 ----------
        function renderStats() {
            const total = DATA.length;
            const yearCount = {};
            for (const r of DATA) {
                yearCount[r['年度']] = (yearCount[r['年度']] || 0) + 1;
            }
            const years = Object.keys(yearCount).sort((a, b) => b - a);
            let html = '<div class="stat-item"><div class="num">' + total + '</div><div class="label">成果总数</div></div>';
            for (const y of years) {
                html += '<div class="stat-item clickable" onclick="selectYear(\'' + y + '\')"><div class="num">' + yearCount[y] + '</div><div class="label">' + y + '年</div></div>';
            }
            document.getElementById('stats-bar').innerHTML = html;
        }

        function renderFilters() {
            const catMap = {};
            const yearMap = {};
            for (const r of DATA) {
                catMap[r['分类']] = (catMap[r['分类']] || 0) + 1;
                yearMap[r['年度']] = (yearMap[r['年度']] || 0) + 1;
            }

            const cats = Object.keys(catMap);
            document.getElementById('filter-cats').innerHTML = cats.map(c =>
                '<label class="filter-item"><input type="checkbox" value="' + esc(c) + '" onchange="onCatFilter(this)"> ' + esc(c) + ' <span class="count">(' + catMap[c] + ')</span></label>'
            ).join('');

            const years = Object.keys(yearMap).sort((a, b) => b - a);
            const tabsBar = document.getElementById('tabs-bar');
            tabsBar.innerHTML = '<div class="active" data-year="" onclick="selectTab(this)">全部</div>' +
                years.map(y => '<div data-year="' + esc(y) + '" onclick="selectTab(this)">' + esc(y) + '年</div>').join('');
        }

        function renderList() {
            const list = filteredData();
            const tbody = document.getElementById('list-tbody');
            tbody.innerHTML = list.map(r =>
                '<tr>' +
                '<td>' + esc(r['序号']) + '</td>' +
                '<td>' + esc(r['年度']) + '</td>' +
                '<td>' + esc(r['分类']) + '</td>' +
                '<td><a onclick="showDetail(' + DATA.indexOf(r) + ')">' + esc(r['名称']) + '</a></td>' +
                '<td>' + esc(normalizeUnits(r['立项单位'])) + '</td>' +
                '<td>' + esc(normalizeUnits(r['承担单位'])) + '</td>' +
                '<td>' + esc(awardLevel(r['获奖情况'])) + '</td>' +
                '</tr>'
            ).join('');
            document.getElementById('list-count').innerText = '为您找到相关结果 ' + list.length + '个';
            document.getElementById('total-count').innerText = '共 ' + list.length + ' 条';
        }

        function selectTab(el) {
            document.querySelectorAll('#tabs-bar div').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            filterYear = el.getAttribute('data-year');
            renderList();
        }
        function selectYear(year) {
            filterYear = year;
            document.querySelectorAll('#tabs-bar div').forEach(d => {
                if (d.getAttribute('data-year') === year) d.classList.add('active');
                else d.classList.remove('active');
            });
            renderList();
        }
        function onCatFilter(el) {
            filterCategory = el.checked ? el.value : '';
            document.querySelectorAll('#filter-cats input').forEach(c => { if (c !== el) c.checked = false; });
            renderList();
        }

        function doSearch() {
            searchKeyword = document.getElementById('search-input').value.trim();
            const modeSel = document.getElementById('search-mode');
            if (modeSel) searchMode = modeSel.value;
            renderList();
        }
        function resetSearch() {
            document.getElementById('search-input').value = '';
            searchKeyword = '';
            renderList();
        }

        // ---------- 详情页 ----------
        function showDetail(idx) {
            currentDetailIndex = idx;
            const r = DATA[idx];
            document.getElementById('detail-title').innerText = r['名称'];

            const meta = [
                ['成果分类', orDash(r['成果分类'] || r['分类'])],
                ['立项单位', orDash(normalizeUnits(r['立项单位']))],
                ['承担单位', orDash(normalizeUnits(r['承担单位']))],
                ['完成时间', orDash(r['完成时间'])]
            ];
            document.getElementById('detail-meta').innerHTML = meta.map(([k, v]) =>
                '<div class="meta-item"><span class="meta-label">' + k + '</span><span class="meta-value">' + esc(v) + '</span></div>'
            ).join('');

            document.getElementById('detail-content').innerHTML = (r['内容提要'] && r['内容提要'].trim())
                ? renderAbstract(r['内容提要'])
                : '<p style="font-weight: bold;">内容提要</p><p>暂无内容提要</p>';

            const names = splitResearchers(r['主要研究人员']);
            document.getElementById('researchers-tbody').innerHTML = names.length
                ? names.map((n, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(n) + '</td></tr>').join('')
                : '<tr><td colspan="2" style="text-align:center;color:#999;">暂无数据</td></tr>';
            document.getElementById('researchers-total').innerText = '共 ' + names.length + ' 条';

            const units = splitUnits(r['完成单位']);
            document.getElementById('units-tbody').innerHTML = units.length
                ? units.map((u, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(u) + '</td></tr>').join('')
                : '<tr><td colspan="2" style="text-align:center;color:#999;">暂无数据</td></tr>';
            document.getElementById('units-total').innerText = '共 ' + units.length + ' 条';

            switchDetailTab('researchers');
            showPage('detail');
        }

        function showPage(pageName) {
            const pageIndex = document.getElementById('page-index');
            const pageDetail = document.getElementById('page-detail');
            const breadcrumbCurrent = document.getElementById('breadcrumb-current');
            if (pageName === 'index') {
                pageIndex.style.display = 'block';
                pageDetail.style.display = 'none';
                breadcrumbCurrent.innerText = '成果列表';
                window.scrollTo(0, 0);
            } else if (pageName === 'detail') {
                pageIndex.style.display = 'none';
                pageDetail.style.display = 'flex';
                breadcrumbCurrent.innerText = '成果详情';
                window.scrollTo(0, 0);
            }
        }

        function switchDetailTab(tabName) {
            const btnResearchers = document.getElementById('tab-btn-researchers');
            const btnUnits = document.getElementById('tab-btn-units');
            const contentResearchers = document.getElementById('tab-content-researchers');
            const contentUnits = document.getElementById('tab-content-units');
            btnResearchers.classList.remove('active');
            btnUnits.classList.remove('active');
            contentResearchers.style.display = 'none';
            contentUnits.style.display = 'none';
            if (tabName === 'researchers') {
                btnResearchers.classList.add('active');
                contentResearchers.style.display = 'block';
            } else if (tabName === 'units') {
                btnUnits.classList.add('active');
                contentUnits.style.display = 'block';
            }
        }

        // ---------- 初始化 ----------
        renderStats();
        renderFilters();
        renderList();
    </script>
</body>
</html>
